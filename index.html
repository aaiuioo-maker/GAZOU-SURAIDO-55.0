<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="画像ビューア">
<title>画像ビューア 郵便業務</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#000018;--win:#000055;--border:#7799ff;--border2:#334499;
  --text:#fff;--gold:#ffdd44;--red:#ff5555;--green:#44ff99;--dim:#556699;
  --font:'DotGothic16',monospace;
}
html,body{width:100%;height:100%;background:var(--bg);font-family:var(--font);color:var(--text);overflow:hidden;}

/* ── OPENING ── */
#opening{
  position:fixed;inset:0;z-index:900;cursor:pointer;
  background:radial-gradient(ellipse 80% 60% at 50% 40%,#000088,#000022,#000);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity 0.8s;
}
#opening.hide{opacity:0;pointer-events:none;}
.stars{position:absolute;inset:0;overflow:hidden;}
.star{position:absolute;width:2px;height:2px;background:#fff;animation:twinkle var(--d) var(--dl) infinite;}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:0.1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes emblemFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes winPop{from{transform:scale(0.85);opacity:0}to{transform:scale(1);opacity:1}}

.op-post{font-size:clamp(5rem,16vw,8rem);filter:drop-shadow(0 0 30px #4466ff) drop-shadow(0 0 60px #2233cc);animation:emblemFloat 3s ease-in-out infinite;position:relative;z-index:2;line-height:1;}
.op-title{text-align:center;position:relative;z-index:2;}
.op-title-main{display:block;font-size:clamp(1.2rem,5vw,2rem);color:var(--gold);text-shadow:0 0 20px #ffaa00,2px 2px 0 #664400;letter-spacing:0.12em;line-height:1.5;}
.op-title-sub{display:block;font-size:clamp(0.4rem,1.5vw,0.6rem);color:#7788bb;letter-spacing:0.22em;margin-top:6px;}
.op-press{border:2px solid var(--border);background:var(--win);padding:12px 32px;box-shadow:inset 0 0 0 1px var(--border2);position:relative;z-index:2;}
.op-press-text{font-size:clamp(0.7rem,2.5vw,1rem);letter-spacing:0.15em;animation:blink 1.1s step-end infinite;}
.op-hint{font-size:0.5rem;color:#334466;letter-spacing:0.1em;position:relative;z-index:2;}

/* ── MAIN APP ── */
#app{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;transition:opacity 0.6s;}
#app.visible{opacity:1;}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--win);border-bottom:2px solid var(--border2);flex-shrink:0;}
.statusbar-title{font-size:0.6rem;color:var(--gold);letter-spacing:0.15em;}
.statusbar-right{display:flex;align-items:center;gap:8px;}
.statusbar-info{font-size:0.58rem;color:#7788cc;}
.menu-btn{font-family:var(--font);font-size:0.6rem;color:var(--text);background:var(--win);border:2px solid var(--border);padding:3px 8px;cursor:pointer;}
.menu-btn:active{background:#0000aa;}
.viewer-area{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0;}
.slide-frame{position:relative;width:100%;max-width:500px;height:100%;display:flex;align-items:center;justify-content:center;}
.slide-container{position:relative;width:100%;aspect-ratio:3/4;max-height:100%;overflow:hidden;background:#000010;border:3px solid var(--border);box-shadow:inset 0 0 0 2px var(--border2);touch-action:none;cursor:grab;}
.slides-track{display:flex;height:100%;transition:transform 0.35s cubic-bezier(0.77,0,0.175,1);}
.slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.slide img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;}
.empty-state{display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;height:100%;color:var(--dim);font-size:0.7rem;}
.empty-state.visible{display:flex;}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);background:var(--win);border:2px solid var(--border);width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;font-size:1rem;}
.nav-btn:active{background:#0000aa;}
.nav-btn.prev{left:-36px;}
.nav-btn.next{right:-36px;}
.nav-btn:disabled{opacity:0.2;}
.dots-area{display:flex;justify-content:center;gap:6px;padding:3px 0;flex-shrink:0;}
.dot{width:6px;height:6px;background:#1a1a44;border:1px solid var(--border2);cursor:pointer;}
.dot.active{background:var(--gold);border-color:var(--gold);}
.textwin-area{flex-shrink:0;padding:5px 8px 6px;}
.textwin{border:3px solid var(--border);background:var(--win);box-shadow:inset 0 0 0 2px var(--border2);padding:8px 12px 6px;min-height:50px;position:relative;}
.textwin-content{font-size:clamp(0.58rem,2vw,0.75rem);line-height:1.7;min-height:2.4em;}
.textwin-arrow{position:absolute;bottom:5px;right:10px;animation:blink 0.8s step-end infinite;font-size:0.65rem;}

/* ── CMD ── */
.cmd-overlay{position:fixed;inset:0;z-index:60;display:none;}
.cmd-overlay.open{display:block;}
.cmd-bg{position:absolute;inset:0;}
.cmdwin{position:absolute;bottom:70px;left:10px;border:3px solid var(--border);background:var(--win);box-shadow:inset 0 0 0 2px var(--border2),4px 4px 0 #000033;padding:6px 0;min-width:150px;animation:winPop 0.15s cubic-bezier(0.34,1.5,0.64,1);}
.cmd-item{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;font-size:clamp(0.6rem,2.2vw,0.78rem);}
.cmd-item:active,.cmd-item.sel{background:#0000aa;color:var(--gold);}
.cmd-cur{display:inline-block;width:10px;color:var(--gold);visibility:hidden;}
.cmd-item.sel .cmd-cur{visibility:visible;}
.cmd-sep{height:1px;background:var(--border2);margin:4px 12px;}
.cmd-hint{padding:4px 14px 2px;font-size:0.5rem;color:var(--dim);}

/* ── MANAGE ── */
.manage-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;opacity:0;transition:opacity 0.3s;}
.manage-screen.open{display:flex;}
.manage-screen.vis{opacity:1;}
.manage-header{padding:10px 12px;background:var(--win);border-bottom:2px solid var(--border2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.manage-title{font-size:0.75rem;color:var(--gold);letter-spacing:0.15em;}
.manage-sub{font-size:0.48rem;color:var(--dim);}
.save-bar{flex-shrink:0;padding:6px 10px;background:#000033;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.save-status{font-size:0.58rem;color:var(--dim);flex:1;}
.save-status.unsaved{color:#ffaa44;}
.save-status.saved{color:var(--green);}
.save-now-btn{font-family:var(--font);font-size:0.62rem;color:var(--gold);background:var(--win);border:2px solid var(--gold);padding:4px 12px;cursor:pointer;}
.save-now-btn:active,.save-now-btn.saving{background:#003300;color:var(--green);border-color:var(--green);}
.manage-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px;display:flex;flex-direction:column;gap:8px;}
.manage-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--border2);background:var(--win);}
.manage-item.drag-over{border-color:var(--green);background:#001820;}
.manage-item.dragging{opacity:0.35;border-color:var(--gold);}
.manage-thumb{width:42px;height:42px;object-fit:cover;border:1px solid var(--border2);flex-shrink:0;}
.manage-num{font-size:0.58rem;color:var(--dim);min-width:18px;}
.manage-label{flex:1;font-size:0.68rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.manage-del{font-family:var(--font);font-size:0.6rem;color:var(--red);background:#330000;border:2px solid #880000;padding:3px 8px;cursor:pointer;}
.manage-del:active{background:#660000;}
.drag-handle{cursor:grab;font-size:1rem;color:var(--dim);padding:0 4px;user-select:none;touch-action:none;}
.manage-footer{flex-shrink:0;padding:8px;display:flex;gap:8px;border-top:2px solid var(--border2);background:var(--win);}
.dq-btn{flex:1;padding:9px 0;font-family:var(--font);font-size:0.68rem;letter-spacing:0.1em;cursor:pointer;border:2px solid var(--border);background:var(--win);color:var(--text);}
.dq-btn:active{background:#0000aa;}
.dq-btn.gold{color:var(--gold);border-color:var(--gold);}

/* ── ZOOM ── */
.zoom-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.96);z-index:400;flex-direction:column;}
.zoom-ov.vis{display:flex;}
.zoom-viewport{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;}
.zoom-canvas{position:absolute;top:0;left:0;transform-origin:0 0;}
.zoom-canvas img{display:block;user-select:none;pointer-events:none;}
.zoom-hud{flex-shrink:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(0,0,20,0.9);border-top:1px solid var(--border2);}
.zoom-hud-btn{font-family:var(--font);font-size:0.65rem;color:var(--text);background:var(--win);border:2px solid var(--border);padding:4px 10px;cursor:pointer;}
.zoom-hud-btn:active{background:#0000aa;}
.zoom-hud-info{font-size:0.55rem;color:var(--dim);}

.toast{position:fixed;bottom:56px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--win);border:2px solid var(--border);padding:6px 18px;font-size:0.62rem;color:var(--gold);z-index:600;opacity:0;transition:opacity 0.25s,transform 0.25s;white-space:nowrap;max-width:92vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- ── OPENING ── -->
<div id="opening">
  <div class="stars" id="opStars"></div>
  <div class="op-post">📬</div>
  <div class="op-press">
    <div class="op-press-text">▶ スタートを押してください ◀</div>
  </div>
  <div class="op-title">
    <span class="op-title-main">画像ビューア<br>郵便業務</span>
    <span class="op-title-sub">POSTAL OPERATIONS IMAGE VIEWER</span>
  </div>
  <div class="op-hint">タップ / クリック でスタート</div>
</div>

<!-- ── MAIN APP ── -->
<div id="app">
  <div class="statusbar">
    <div class="statusbar-title">📬 画像ビューア 郵便業務</div>
    <div class="statusbar-right">
      <div class="statusbar-info" id="statusInfo">- / -</div>
      <button class="menu-btn" onclick="openCmd()">コマンド ▼</button>
    </div>
  </div>
  <div class="viewer-area">
    <div class="slide-frame">
      <button class="nav-btn prev" id="prevBtn" onclick="move(-1)">◄</button>
      <div class="slide-container" id="container">
        <div class="slides-track" id="track">
          <div class="empty-state visible" id="emptyState">
            <div style="font-size:1.8rem">🖼️</div>
            <div>がぞうがありません</div>
          </div>
        </div>
      </div>
      <button class="nav-btn next" id="nextBtn" onclick="move(1)">►</button>
    </div>
  </div>
  <div class="dots-area" id="dots"></div>
  <div class="textwin-area">
    <div class="textwin">
      <div class="textwin-content" id="textContent"></div>
      <span class="textwin-arrow" id="textArrow" style="display:none">▼</span>
    </div>
  </div>
</div>

<!-- CMD -->
<div class="cmd-overlay" id="cmdOverlay">
  <div class="cmd-bg" onclick="closeCmd()"></div>
  <div class="cmdwin">
    <div class="cmd-item sel" onclick="execCmd(0)"><span class="cmd-cur">►</span>みる（ズーム）</div>
    <div class="cmd-item"    onclick="execCmd(1)"><span class="cmd-cur">►</span>つぎへ</div>
    <div class="cmd-item"    onclick="execCmd(2)"><span class="cmd-cur">►</span>まえへ</div>
    <div class="cmd-sep"></div>
    <div class="cmd-item"    onclick="execCmd(3)"><span class="cmd-cur">►</span>かんり</div>
    <div class="cmd-hint">↑↓えらぶ　Enter けってい　Escとじる</div>
  </div>
</div>

<!-- MANAGE -->
<div class="manage-screen" id="manageScreen">
  <div class="manage-header">
    <div class="manage-title">📂 がぞうのかんり</div>
    <div class="manage-sub">≡ ドラッグで いれかえ</div>
  </div>
  <div class="save-bar">
    <div class="save-status" id="saveStatus">💾 よみこみ中...</div>
    <button class="save-now-btn" id="saveNowBtn" onclick="manualSave()">💾 いまほぞん</button>
  </div>
  <div class="manage-list" id="manageList"></div>
  <div class="manage-footer">
    <button class="dq-btn gold" onclick="triggerAdd()">＋ ついか</button>
    <button class="dq-btn"      onclick="closeManage()">もどる</button>
  </div>
</div>
<input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(event)">

<!-- ZOOM -->
<div class="zoom-ov" id="zoom">
  <div class="zoom-viewport" id="zoomViewport">
    <div class="zoom-canvas" id="zoomCanvas"><img id="zoomImg" src="" alt=""></div>
  </div>
  <div class="zoom-hud">
    <button class="zoom-hud-btn" onclick="zoomOut()">－ ちいさく</button>
    <span class="zoom-hud-info" id="zoomInfo">100%</span>
    <button class="zoom-hud-btn" onclick="closeZoom()">✕ とじる</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ══ AUDIO ══ */
var _ctx=null;
function ac(){if(!_ctx)_ctx=new(window.AudioContext||window.webkitAudioContext)();return _ctx;}
function tone(f,dur,vol,type,delay){
  vol=vol||0.13;type=type||'square';delay=delay||0;
  try{var ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);o.type=type;o.frequency.value=f;
  var t=ctx.currentTime+delay;g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur);}catch(e){}
}
function sfxCursor(){tone(440,0.05,0.09);}
function sfxDecide(){tone(880,0.07,0.12);tone(1100,0.06,0.1,'square',0.07);}
function sfxCancel(){tone(300,0.1,0.12);}
function sfxSlide(){tone(660,0.06,0.1,'sine');}
function sfxDelete(){tone(220,0.14,0.14);tone(160,0.1,0.1,'square',0.09);}
function sfxAdd(){tone(660,0.05,0.1);tone(880,0.07,0.12,'square',0.07);}
function sfxZoom(){tone(550,0.05,0.1,'sine');tone(770,0.08,0.1,'sine',0.06);}
function sfxChar(){tone(700+Math.random()*150,0.018,0.04,'square');}
function sfxSave(){[528,660,792].forEach(function(f,i){tone(f,0.12,0.14,'sine',i*0.07);});}
function sfxFanfare(){
  [392,523,659,784,1047].forEach(function(f,i){tone(f,0.18,0.2,'square',i*0.09);});
  setTimeout(function(){tone(1047,0.3,0.18,'square');tone(784,0.3,0.1,'square');},500);
}

/* ══ STARS ══ */
(function(){
  var el=document.getElementById('opStars');
  for(var i=0;i<80;i++){
    var s=document.createElement('div');s.className='star';
    s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;--d:'+(1.5+Math.random()*3)+'s;--dl:'+Math.random()*3+'s;opacity:'+(0.3+Math.random()*0.7);
    el.appendChild(s);
  }
})();

/* ══ OPENING ══ */
var opening=true;

function launchApp(){
  if(!opening)return;
  opening=false;
  sfxFanfare();
  var op=document.getElementById('opening');
  op.classList.add('hide');
  document.getElementById('app').classList.add('visible');
  loadSaved().then(function(found){
    if(!found) images=BUILTIN_IMAGES.slice();
    renderSlides(true);
    typeText('ようこそ！\nがぞうをえらんでください。\nコマンドボタンでそうさできます。');
    if(found) markSaved(); else markUnsaved();
  });
  setTimeout(function(){ op.style.display='none'; }, 900);
}

document.getElementById('opening').addEventListener('click', function(){
  launchApp();
});
document.addEventListener('keydown', function(e){
  if(opening && (e.key==='Enter' || e.key===' ')){
    launchApp(); e.preventDefault();
  }
});

/* ══ IndexedDB ══ */
var DB_NAME='postalViewer3',DB_VER=1,STORE='state',_db=null;
function openDB(){
  return new Promise(function(res,rej){
    if(_db){res(_db);return;}
    var req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=function(e){e.target.result.createObjectStore(STORE);};
    req.onsuccess=function(e){_db=e.target.result;res(_db);};
    req.onerror=function(e){rej(e);};
  });
}
function dbSet(key,val){
  return openDB().then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(val,key);
    tx.oncomplete=res;tx.onerror=rej;
  });});
}
function dbGet(key){
  return openDB().then(function(db){return new Promise(function(res,rej){
    var tx=db.transaction(STORE,'readonly');
    var req=tx.objectStore(STORE).get(key);
    req.onsuccess=function(e){res(e.target.result);};
    req.onerror=rej;
  });});
}
function loadSaved(){
  return dbGet('images').then(function(data){
    if(Array.isArray(data)&&data.length>0){images=data;return true;}
    return false;
  }).catch(function(){return false;});
}
function manualSave(){
  sfxSave();
  var btn=document.getElementById('saveNowBtn');
  btn.textContent='⏳...';btn.classList.add('saving');btn.disabled=true;
  var data=images.map(function(img){return {label:img.label,src:img.src};});
  dbSet('images',data).then(function(){
    markSaved();
    btn.textContent='✓ ほぞんしました！';
    showToast('💾 ほぞんしました！つぎかいも このじょうたいで きどうします ✓');
    setTimeout(function(){btn.textContent='💾 いまほぞん';btn.classList.remove('saving');btn.disabled=false;},2200);
  }).catch(function(){
    btn.textContent='💾 いまほぞん';btn.classList.remove('saving');btn.disabled=false;
    showToast('⚠️ ほぞんに しっぱい。iPhoneの せってい→Safari→詳細→サイトデータを かくにん');
  });
}
var hasUnsaved=false;
function markUnsaved(){
  hasUnsaved=true;
  var st=document.getElementById('saveStatus');
  if(st){st.textContent='⚠️ みほぞんのへんこうがあります';st.className='save-status unsaved';}
}
function markSaved(){
  hasUnsaved=false;
  var st=document.getElementById('saveStatus');
  if(st){st.textContent='✓ ほぞんずみ';st.className='save-status saved';}
}

/* ══ IMAGE DATA ══ */
const BUILTIN_IMAGES = [{"label": "禁止品目・注意事項", "src": "img/slide-01.jpg"}, {"label": "集荷七区・号便", "src": "img/slide-02.jpg"}, {"label": "集混合速・号便", "src": "img/slide-03.jpg"}, {"label": "休日コンビニ", "src": "img/slide-04.jpg"}, {"label": "区内特別・割引情報", "src": "img/slide-05.jpg"}, {"label": "休日コンビニ（ガンダム）", "src": "img/slide-06.jpg"}, {"label": "PUDOステーション発送手続き", "src": "img/slide-07.jpg"}];

var images=[],current=0;

/* ══ TEXT WRITER ══ */
var typeTimer=null;
function typeText(msg){
  clearTimeout(typeTimer);
  document.getElementById('textArrow').style.display='none';
  document.getElementById('textContent').textContent='';
  var i=0;
  function next(){
    var el=document.getElementById('textContent');
    var arrow=document.getElementById('textArrow');
    if(i<msg.length){
      if(msg[i]==='\n') el.innerHTML+='<br>';
      else{el.textContent+=msg[i];sfxChar();}
      i++;typeTimer=setTimeout(next,36);
    }else arrow.style.display='';
  }
  next();
}

/* ══ SLIDES ══ */
function renderSlides(silent){
  var track=document.getElementById('track');
  var dotsEl=document.getElementById('dots');
  track.querySelectorAll('.slide').forEach(function(s){s.remove();});
  dotsEl.innerHTML='';
  var emptyState=document.getElementById('emptyState');
  var prevBtn=document.getElementById('prevBtn');
  var nextBtn=document.getElementById('nextBtn');
  var statusInfo=document.getElementById('statusInfo');
  if(images.length===0){
    emptyState.classList.add('visible');statusInfo.textContent='- / -';
    prevBtn.disabled=true;nextBtn.disabled=true;track.style.transform='translateX(0)';
    typeText('がぞうがありません。\nコマンド→かんり からついかしてください。');return;
  }
  emptyState.classList.remove('visible');
  images.forEach(function(img,i){
    var slide=document.createElement('div');slide.className='slide';
    var el=document.createElement('img');el.src=img.src;el.alt=img.label;
    slide.appendChild(el);track.appendChild(slide);
    var dot=document.createElement('div');dot.className='dot';
    dot.addEventListener('click',function(){sfxDecide();goTo(i);});
    dotsEl.appendChild(dot);
  });
  if(current>=images.length)current=images.length-1;
  if(current<0)current=0;
  goTo(current,silent);
}
function goTo(n,silent){
  var prevBtn=document.getElementById('prevBtn');
  var nextBtn=document.getElementById('nextBtn');
  var statusInfo=document.getElementById('statusInfo');
  current=Math.max(0,Math.min(n,images.length-1));
  document.getElementById('track').style.transform='translateX('+(-100*current)+'%)';
  document.querySelectorAll('.dot').forEach(function(d,i){d.classList.toggle('active',i===current);});
  statusInfo.textContent=images.length?(current+1)+' / '+images.length:'- / -';
  prevBtn.disabled=current===0||images.length===0;
  nextBtn.disabled=current===images.length-1||images.length===0;
  if(!silent&&images.length)typeText('【 '+images[current].label+' 】\nダブルタップで かくだいできます。');
}
function move(dir){
  if(dir>0&&current<images.length-1){sfxSlide();goTo(current+1);}
  else if(dir<0&&current>0){sfxSlide();goTo(current-1);}
  else sfxCancel();
}

/* swipe + double-tap */
var sx=0,sy=0,drag=false,lastTap=0,tapTO=null;
var container=document.getElementById('container');
container.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;drag=true;});
container.addEventListener('pointerup',function(e){
  if(!drag)return;drag=false;
  var dx=e.clientX-sx,dy=e.clientY-sy,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<12){
    var now=Date.now();
    if(now-lastTap<350){clearTimeout(tapTO);lastTap=0;if(images.length){sfxZoom();openZoom(current);}}
    else{lastTap=now;tapTO=setTimeout(function(){lastTap=0;},360);}
  }else if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.2){move(dx<0?1:-1);}
});
container.addEventListener('pointercancel',function(){drag=false;});

/* ══ COMMAND ══ */
var cmdOpen=false,cmdIdx=0;
var CMD_ITEMS=document.querySelectorAll('.cmd-item');
var NCMDS=CMD_ITEMS.length;
function openCmd(){if(cmdOpen)return;cmdOpen=true;cmdIdx=0;document.getElementById('cmdOverlay').classList.add('open');updateSel();sfxDecide();}
function closeCmd(){cmdOpen=false;document.getElementById('cmdOverlay').classList.remove('open');sfxCancel();}
function updateSel(){CMD_ITEMS.forEach(function(el,i){el.classList.toggle('sel',i===cmdIdx);});}
function execCmd(idx){
  cmdIdx=idx;sfxDecide();closeCmd();
  if(idx===0){if(images.length){sfxZoom();openZoom(current);}else typeText('がぞうがありません。');}
  else if(idx===1)move(1);
  else if(idx===2)move(-1);
  else if(idx===3)openManage();
}
document.getElementById('cmdOverlay').addEventListener('click',function(e){
  if(e.target.classList.contains('cmd-bg'))closeCmd();
});
document.addEventListener('keydown',function(e){
  if(opening)return;
  if(document.getElementById('manageScreen').classList.contains('open')){
    if(e.key==='Escape'){closeManage();e.preventDefault();}return;
  }
  if(document.getElementById('zoom').classList.contains('vis')){
    if(e.key==='Escape'){closeZoom();e.preventDefault();}return;
  }
  if(cmdOpen){
    if(e.key==='ArrowDown'){sfxCursor();cmdIdx=(cmdIdx+1)%NCMDS;updateSel();e.preventDefault();}
    else if(e.key==='ArrowUp'){sfxCursor();cmdIdx=(cmdIdx+NCMDS-1)%NCMDS;updateSel();e.preventDefault();}
    else if(e.key==='Enter'||e.key===' '){execCmd(cmdIdx);e.preventDefault();}
    else if(e.key==='Escape'){closeCmd();e.preventDefault();}
  }else{
    if(e.key==='ArrowRight')move(1);
    else if(e.key==='ArrowLeft')move(-1);
    else if(e.key==='Enter'||e.key===' '){openCmd();e.preventDefault();}
  }
});

/* ══ MANAGE ══ */
var dragSrc=null,dragEl=null,placeholder=null,touchDragItem=null,touchClone=null,touchStartY=0;
function openManage(){
  renderManage();
  var ms=document.getElementById('manageScreen');
  ms.classList.add('open');
  requestAnimationFrame(function(){ms.classList.add('vis');});
  typeText('かんりがめんです。\n≡ ドラッグで いれかえ。へんこう後は ほぞんを！');
}
function closeManage(){
  sfxCancel();
  if(hasUnsaved&&!confirm('みほぞんのへんこうがあります。\nほぞんせずに もどりますか？')){return;}
  var ms=document.getElementById('manageScreen');
  ms.classList.remove('vis');setTimeout(function(){ms.classList.remove('open');},300);
  renderSlides();typeText('かんりがめんをとじました。');
}
function renderManage(){
  var list=document.getElementById('manageList');list.innerHTML='';
  if(images.length===0){
    list.innerHTML='<div style="text-align:center;color:var(--dim);font-size:0.7rem;padding:20px">がぞうがありません</div>';return;
  }
  images.forEach(function(img,i){
    var item=document.createElement('div');item.className='manage-item';
    var handle=document.createElement('span');handle.className='drag-handle';handle.textContent='≡';
    var thumb=document.createElement('img');thumb.className='manage-thumb';thumb.src=img.src;
    var num=document.createElement('span');num.className='manage-num';num.textContent=String(i+1).padStart(2,'0');
    var lbl=document.createElement('span');lbl.className='manage-label';lbl.textContent=img.label;
    var del=document.createElement('button');del.className='manage-del';del.textContent='さくじょ';
    del.addEventListener('click',function(){deleteImage(i);});
    item.appendChild(handle);item.appendChild(thumb);item.appendChild(num);item.appendChild(lbl);item.appendChild(del);
    list.appendChild(item);
    handle.addEventListener('mousedown',function(e){
      e.preventDefault();dragSrc=i;dragEl=item;item.classList.add('dragging');
      placeholder=document.createElement('div');placeholder.className='manage-item';
      placeholder.style.cssText='border:2px dashed var(--green);background:transparent;height:'+item.offsetHeight+'px;';
      list.insertBefore(placeholder,item.nextSibling);
    });
    handle.addEventListener('touchstart',function(e){
      e.preventDefault();touchDragItem=item;dragSrc=i;touchStartY=e.touches[0].clientY;
      item.classList.add('dragging');
      placeholder=document.createElement('div');placeholder.className='manage-item';
      placeholder.style.cssText='border:2px dashed var(--green);background:transparent;height:'+item.offsetHeight+'px;';
      list.insertBefore(placeholder,item.nextSibling);
      var rect=item.getBoundingClientRect();
      touchClone=item.cloneNode(true);
      touchClone.style.cssText='position:fixed;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;opacity:0.85;z-index:999;pointer-events:none;border:2px solid var(--green);background:var(--win);';
      document.body.appendChild(touchClone);
    },{passive:false});
  });
  list.addEventListener('mousemove',function(e){
    if(dragSrc===null||!dragEl)return;
    var items=Array.from(list.querySelectorAll('.manage-item:not(.dragging)')).filter(function(el){return !el.isSameNode(placeholder);});
    for(var k=0;k<items.length;k++){
      var r=items[k].getBoundingClientRect();
      if(e.clientY<r.top+r.height/2){list.insertBefore(placeholder,items[k]);break;}
      else if(k===items.length-1){list.appendChild(placeholder);}
    }
  });
  list.addEventListener('mouseup',function(){if(dragSrc!==null&&dragEl)finishDrag();});
  list.addEventListener('touchmove',function(e){
    if(!touchDragItem)return;e.preventDefault();
    var ty=e.touches[0].clientY;
    if(touchClone){touchClone.style.top=(parseFloat(touchClone.style.top)+(ty-touchStartY))+'px';touchStartY=ty;}
    var items=Array.from(list.querySelectorAll('.manage-item:not(.dragging)')).filter(function(el){return !el.isSameNode(placeholder);});
    for(var k=0;k<items.length;k++){
      var r=items[k].getBoundingClientRect();
      if(ty<r.top+r.height/2){list.insertBefore(placeholder,items[k]);break;}
      else if(k===items.length-1){list.appendChild(placeholder);}
    }
  },{passive:false});
  list.addEventListener('touchend',function(){
    if(!touchDragItem)return;
    if(touchClone){touchClone.remove();touchClone=null;}
    finishDrag();touchDragItem=null;
  });
}
function finishDrag(){
  var list=document.getElementById('manageList');
  var allItems=Array.from(list.querySelectorAll('.manage-item'));
  var count=0;
  for(var j=0;j<allItems.length;j++){
    if(allItems[j].isSameNode(placeholder))break;
    if(!allItems[j].classList.contains('dragging'))count++;
  }
  var destIdx=count;
  if(dragEl)dragEl.classList.remove('dragging');
  if(placeholder&&placeholder.parentNode)placeholder.parentNode.removeChild(placeholder);
  placeholder=null;
  if(destIdx!==dragSrc){
    var moved=images.splice(dragSrc,1)[0];images.splice(destIdx,0,moved);
    if(current===dragSrc)current=destIdx;
    sfxDecide();markUnsaved();renderManage();
    showToast('いれかえました！上の 💾ほぞん を おしてください');
  }
  dragSrc=null;dragEl=null;
}
document.addEventListener('mouseup',function(){if(dragSrc!==null)finishDrag();});
function deleteImage(i){
  if(!confirm('「'+images[i].label+'」を さくじょしますか？'))return;
  sfxDelete();images.splice(i,1);
  if(current>=images.length)current=Math.max(0,images.length-1);
  markUnsaved();renderManage();showToast('さくじょしました！💾ほぞんを わすれずに');
}
function triggerAdd(){document.getElementById('fileInput').click();}
function handleFiles(e){
  var files=Array.from(e.target.files);if(!files.length)return;var loaded=0;
  files.forEach(function(file){
    var r=new FileReader();
    r.onload=function(ev){
      images.push({label:file.name.replace(/\.[^.]+$/,''),src:ev.target.result});
      if(++loaded===files.length){sfxAdd();markUnsaved();renderManage();showToast(files.length+'まい ついか！💾ほぞんを わすれずに');}
    };
    r.readAsDataURL(file);
  });
  e.target.value='';
}

/* ══ ZOOM ══ */
var zoomEl=document.getElementById('zoom'),zoomViewport=document.getElementById('zoomViewport'),
    zoomCanvas=document.getElementById('zoomCanvas'),zoomImg=document.getElementById('zoomImg'),
    zoomInfo=document.getElementById('zoomInfo');
var zScale=1,zTx=0,zTy=0,zImgW=0,zImgH=0;
function zApply(anim){
  var vw=window.innerWidth,vh=window.innerHeight-44;
  var minX=Math.min(0,vw-zImgW*zScale),minY=Math.min(0,vh-zImgH*zScale);
  zTx=Math.max(minX,Math.min(0,zTx));zTy=Math.max(minY,Math.min(0,zTy));
  zoomCanvas.style.transition=anim?'transform 0.25s':'none';
  zoomCanvas.style.transform='translate('+zTx+'px,'+zTy+'px) scale('+zScale+')';
  zoomInfo.textContent=Math.round(zScale*100)+'%　ダブルタップで拡大';
}
function zCenter(){var vw=window.innerWidth,vh=window.innerHeight-44;zTx=(vw-zImgW*zScale)/2;zTy=(vh-zImgH*zScale)/2;}
function openZoom(i){
  zoomImg.onload=function(){
    zImgW=zoomImg.naturalWidth;zImgH=zoomImg.naturalHeight;
    var vw=window.innerWidth,vh=window.innerHeight-44;
    zScale=Math.min(vw/zImgW,vh/zImgH,1);zCenter();zApply(false);
  };
  zoomImg.src=images[i].src;zoomEl.classList.add('vis');
}
function closeZoom(){zoomEl.classList.remove('vis');zoomImg.src='';}
function zoomOut(){zScale=Math.max(0.5,zScale*0.6);zCenter();zApply(true);}
var zPtrs={},zLastPinch=0,zLastTap=0,zPanStart={x:0,y:0,tx:0,ty:0};
zoomViewport.addEventListener('pointerdown',function(e){
  e.preventDefault();zoomViewport.setPointerCapture(e.pointerId);
  zPtrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(zPtrs);
  if(ids.length===1){zPanStart={x:e.clientX,y:e.clientY,tx:zTx,ty:zTy};}
  else if(ids.length===2){var a=zPtrs[ids[0]],b=zPtrs[ids[1]];zLastPinch=Math.hypot(a.x-b.x,a.y-b.y);}
});
zoomViewport.addEventListener('pointermove',function(e){
  e.preventDefault();if(!zPtrs[e.pointerId])return;
  zPtrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(zPtrs);
  if(ids.length===1){zTx=zPanStart.tx+(e.clientX-zPanStart.x);zTy=zPanStart.ty+(e.clientY-zPanStart.y);zApply(false);}
  else if(ids.length===2){
    var a=zPtrs[ids[0]],b=zPtrs[ids[1]],dist=Math.hypot(a.x-b.x,a.y-b.y);
    if(zLastPinch>0){
      var r=dist/zLastPinch,mx=(a.x+b.x)/2,my=(a.y+b.y)/2,ps=zScale;
      zScale=Math.min(8,Math.max(0.5,zScale*r));
      zTx=mx-(mx-zTx)*(zScale/ps);zTy=my-(my-zTy)*(zScale/ps);zApply(false);
    }
    zLastPinch=dist;
  }
});
zoomViewport.addEventListener('pointerup',function(e){
  e.preventDefault();
  if(Object.keys(zPtrs).length===1){
    var now=Date.now(),dx=e.clientX-zPanStart.x,dy=e.clientY-zPanStart.y;
    if(Math.sqrt(dx*dx+dy*dy)<10){
      if(now-zLastTap<350){
        if(zScale>1.5){zScale=Math.min(1,window.innerWidth/zImgW,(window.innerHeight-44)/zImgH);zCenter();}
        else{zScale=Math.min(8,2.5);zTx=-(e.clientX*zScale-e.clientX);zTy=-(e.clientY*zScale-e.clientY);}
        zApply(true);zLastTap=0;
      }else zLastTap=now;
    }
  }
  delete zPtrs[e.pointerId];if(Object.keys(zPtrs).length===0)zLastPinch=0;
});
zoomViewport.addEventListener('pointercancel',function(e){delete zPtrs[e.pointerId];});
zoomViewport.addEventListener('wheel',function(e){
  e.preventDefault();var r=e.deltaY<0?1.15:0.87,ps=zScale;
  zScale=Math.min(8,Math.max(0.5,zScale*r));
  zTx=e.clientX-(e.clientX-zTx)*(zScale/ps);zTy=e.clientY-(e.clientY-zTy)*(zScale/ps);zApply(false);
},{passive:false});

/* ══ TOAST ══ */
var toastT=null;
function showToast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},3000);
}
</script>
